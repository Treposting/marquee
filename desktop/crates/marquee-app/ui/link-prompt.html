<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Open link</title>
  <link rel="stylesheet" href="link-prompt.css">
</head>
<body>
  <section class="card" id="card" role="dialog" aria-labelledby="title" aria-describedby="summary" hidden>
    <header>
      <span class="badge" aria-hidden="true">
        <svg id="icon-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>
        <svg id="icon-qr" viewBox="0 0 24 24" hidden><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><path d="M14 14h2v2h-2zM18 18h2v2h-2zM14 18h2M18 14h2"/></svg>
      </span>
      <div class="titles">
        <h1 id="title"></h1>
        <p id="summary"></p>
      </div>
      <button class="close" id="close" title="Close (Esc)" aria-label="Close"><svg viewBox="0 0 24 24"><path d="m7 7 10 10M17 7 7 17"/></svg></button>
    </header>
    <div id="links"></div>
  </section>
  <script src="link-prompt.js"></script>
</body>
</html>
