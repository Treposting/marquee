<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Marquee capture</title>
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="overlay.css">
</head>
<body>
  <!-- The frozen display, then the dim mask and the selection drawn over it. -->
  <canvas id="frame"></canvas>
  <canvas id="ui"></canvas>
  <div id="hint" class="pill" role="status"></div>
  <!-- All-in-One only. -->
  <div id="toolbar" role="toolbar" aria-label="All-in-One" hidden>
    <button aria-label="Screenshot" class="primary" data-action="screenshot" title="Screenshot (Enter)">
      <svg viewBox="0 0 20 20"><path d="M3.5 7V4.5h3M13.5 4.5h3V7M16.5 13v2.5h-3M6.5 15.5h-3V13"/><circle cx="10" cy="10" r="2.6"/></svg><span class="label">Screenshot</span><kbd>Enter</kbd></button>
    <button aria-label="Copy" data-action="copy" title="Copy to clipboard (Ctrl+C)">
      <svg viewBox="0 0 20 20"><rect x="7" y="7" width="9.5" height="9.5" rx="1.6"/><path d="M4.5 13V5a1 1 0 0 1 1-1H13"/></svg><span class="label">Copy</span><kbd>Ctrl+C</kbd></button>
    <button aria-label="Window" data-action="window" title="Pick a window (W)">
      <svg viewBox="0 0 20 20"><rect x="3" y="4.5" width="14" height="11" rx="1.6"/><path d="M3 7.5h14"/></svg><span class="label">Window</span><kbd>W</kbd></button>
    <button aria-label="Full Screen" data-action="fullscreen" title="Full screen (F)">
      <svg viewBox="0 0 20 20"><rect x="2.5" y="3.5" width="15" height="10" rx="1.6"/><path d="M7.5 16.5h5M10 13.5v3"/></svg><span class="label">Full Screen</span><kbd>F</kbd></button>
    <button aria-label="Copy Text" data-action="text" title="Copy the text and QR codes in it (T)">
      <svg viewBox="0 0 20 20"><path d="M3.5 7V4.5h3M13.5 4.5h3V7M16.5 13v2.5h-3M6.5 15.5h-3V13M7.5 8h5M10 8v5"/></svg><span class="label">Copy Text</span><kbd>T</kbd></button>
    <button aria-label="Annotate" data-action="annotate" title="Annotate (A)">
      <svg viewBox="0 0 20 20"><path d="m12.5 4 3.5 3.5-8.5 8.5H4v-3.5zM10.5 6l3.5 3.5"/></svg><span class="label">Annotate</span><kbd>A</kbd></button>
    <button aria-label="Pin" data-action="pin" title="Pin above other windows (P)">
      <svg viewBox="0 0 20 20"><path d="M7.5 3.5h5l-.8 5 2.5 2.5H5.8l2.5-2.5zM10 11v5.5"/></svg><span class="label">Pin</span><kbd>P</kbd></button>
    <button aria-label="Color" data-action="color" title="Pick a color (C)">
      <svg viewBox="0 0 20 20"><path d="M12.6 3.4a1.9 1.9 0 0 1 2.7 0l1.3 1.3a1.9 1.9 0 0 1 0 2.7L15 9l-4-4zM11.6 5.6l2.8 2.8M12 8 5.4 14.6 3.5 16.5M12 8l-6.6 6.6M10.6 6.6 4 13.2v2.8h2.8l6.6-6.6"/></svg><span class="label">Color</span><kbd>C</kbd></button>
    <span class="divider" aria-hidden="true"></span>
    <span id="size" class="size"></span>
    <button class="round" data-action="settings" title="Marquee settings" aria-label="Marquee settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    <button class="round" data-action="close" title="Cancel (Esc)" aria-label="Cancel">
      <svg viewBox="0 0 20 20"><path d="M6 6l8 8M14 6l-8 8"/></svg></button>
  </div>
  <script src="measure-core.js"></script>
  <script src="measure.js"></script>
  <script src="color.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
