name: Build

on:
  push:
    branches: ["**"]
    paths-ignore: ["site/**", "**.md", ".github/workflows/pages.yml", "desktop/**", ".github/workflows/desktop.yml"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # Building with the macOS 26 SDK turns on Liquid Glass for Marquee's windows and
      # controls on macOS 26 and 27 (apps built with older SDKs keep the old look).
      - name: Select Xcode 26
        run: |
          XCODE="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
      - name: Swift version
        run: swift --version
      - name: Run tests
        run: swift test
      - name: Build universal app and DMG
        run: ./scripts/make-dmg.sh
      # Releases are signed with a self-signed certificate (docs/SIGNING.md) so macOS keeps
      # permissions across updates. Check that such a certificate signs a copy of the app.
      - name: Check self-signed code signing
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/selfsign"; mkdir -p "$T"
          printf '[req]\ndistinguished_name=dn\nx509_extensions=ext\nprompt=no\n[dn]\nCN=Marquee CI Test\n[ext]\nbasicConstraints=critical,CA:false\nkeyUsage=critical,digitalSignature\nextendedKeyUsage=critical,codeSigning\n' > "$T/cert.cnf"
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -keyout "$T/key.pem" -out "$T/cert.pem" -config "$T/cert.cnf" 2>/dev/null
          LEGACY=""; if openssl pkcs12 -help 2>&1 | grep -q -- "-legacy"; then LEGACY="-legacy"; fi
          openssl pkcs12 -export $LEGACY -inkey "$T/key.pem" -in "$T/cert.pem" -name "Marquee CI Test" -out "$T/cert.p12" -passout pass:test
          KC="$T/test.keychain-db"
          security create-keychain -p "" "$KC"
          security unlock-keychain -p "" "$KC"
          security import "$T/cert.p12" -k "$KC" -P test -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KC" >/dev/null
          cp -R build/Marquee.app "$T/Marquee.app"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -p codesigning "$KC"
          # Untrusted self-signed identities aren't found by name; sign by their SHA-1 hash.
          HASH="$(security find-identity -p codesigning "$KC" | awk '/"Marquee CI Test"/ {print $2; exit}')"
          codesign --force --sign "$HASH" "$T/Marquee.app"
          codesign --verify --strict "$T/Marquee.app"
          codesign -dr - "$T/Marquee.app" 2>&1 | tail -1
          codesign -dr - "$T/Marquee.app" 2>&1 | grep -q "certificate leaf"
          security delete-keychain "$KC"
      - name: Preview the app icon in light and dark mode
        run: |
          ICTOOL="$(xcode-select -p)/../Applications/Icon Composer.app/Contents/Executables/ictool"
          for rendition in Default Dark; do
            "$ICTOOL" build/AppIcon.icon --export-image --output-file "build/icon-$rendition.png" \
              --platform macOS --rendition "$rendition" --width 512 --height 512 --scale 1 || true
          done
          swift scripts/preview-icon.swift build/icon-Default.png build/icon-Dark.png || true
      - uses: actions/upload-artifact@v4
        with:
          name: Marquee-dmg
          path: |
            build/*.dmg
            build/icon-*.png
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.dmg
          generate_release_notes: true
